<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="2380" viewBox="0 0 1480 2380" role="img" aria-labelledby="title desc">
  <title id="title">Layer-wise hallucination verifier for an LLM root-cause analysis agent</title>
  <desc id="desc">Data flow from an RCA diagnosis through claim segmentation, a per-layer activation tap, early middle and late transformer bands, four failure-mode probes, a depth aggregator, and a decision policy.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 26px "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 15px "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
      .h { font: 700 16px "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .b { font: 400 13.5px "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e293b; }
      .m { font: 400 12.5px "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
      .s { font: 600 11px "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; letter-spacing: 0.04em; }
      .chip { font: 700 12px "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font: 600 12.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1480" height="2380" fill="#f4f6f8"/>
  <text class="title" x="36" y="46">Hallucination verifier for an LLM root-cause agent</text>
  <text class="sub" x="36" y="72">Each diagnosis is split into claims. Every transformer layer is read. Four failure modes stay separate until the policy.</text>

  <text class="s" x="36" y="108">L0  INTAKE - OUTSIDE THE VERIFIER</text>
  <g filter="url(#shadow)">
    <rect x="36" y="120" width="450" height="132" rx="12" fill="#ffffff" stroke="#d6dee8"/>
    <text class="h" x="54" y="148">Diagnosis trajectory</text>
    <text class="b" x="54" y="174">Plan, tool calls, tool observations,</text>
    <text class="b" x="54" y="194">and the generated root-cause text.</text>
    <text class="m" x="54" y="228">The string the operator would read.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="508" y="120" width="450" height="132" rx="12" fill="#ffffff" stroke="#d6dee8"/>
    <text class="h" x="526" y="148">Evidence token map</text>
    <text class="b" x="526" y="174">Which context spans are logs, metrics,</text>
    <text class="b" x="526" y="194">traces, or tickets, not model prose.</text>
    <text class="m" x="526" y="228">Built from the tool results the agent saw.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="980" y="120" width="464" height="132" rx="12" fill="#ffffff" stroke="#d6dee8"/>
    <text class="h" x="998" y="148">Frozen transformer</text>
    <text class="b" x="998" y="174">L blocks, residual stream, attention,</text>
    <text class="b" x="998" y="194">MLP, and unembedding matrix W_U.</text>
    <text class="m" x="998" y="228">Weights are not updated by the verifier.</text>
  </g>

  <line x1="740" y1="252" x2="740" y2="286" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="24" y="292" width="1432" height="2010" rx="16" fill="#eef2f6" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text class="s" x="44" y="318">VERIFIER</text>

  <text class="s" x="44" y="348">L1  CLAIM SEGMENTER</text>
  <g filter="url(#shadow)">
    <rect x="44" y="360" width="1392" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="b" x="64" y="390">The diagnosis is split into atomic claims. A claim is one checkable statement, not the whole write-up.</text>
    <text class="b" x="64" y="418">Each claim keeps the token span of its evidence citation, its entities, its causal wording, and any certainty language.</text>
    <text class="m" x="64" y="458">Example: "checkout failed because payment-service timed out on span sp-19." Citation, entity, cause, and confidence are scored apart.</text>
  </g>

  <line x1="740" y1="488" x2="740" y2="518" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <text class="s" x="44" y="544">L2  ACTIVATION TAP - EVERY LAYER, TWO WINDOWS</text>
  <g filter="url(#shadow)">
    <rect x="44" y="556" width="680" height="188" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="h" x="64" y="586">Conditioning window</text>
    <text class="b" x="64" y="614">Tokens of the tool observations already in context.</text>
    <text class="b" x="64" y="636">Records where the claim attends inside real evidence.</text>
    <text class="h" x="64" y="672">Generation window</text>
    <text class="b" x="64" y="698">Tokens of the claim as they were produced.</text>
    <text class="m" x="64" y="722">Both windows are read at every layer.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="744" y="556" width="692" height="188" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="h" x="764" y="586">Saved at each layer l and token t</text>
    <text class="mono" x="764" y="620">h_l    residual after block l</text>
    <text class="mono" x="1080" y="620">A_l    attention from the claim</text>
    <text class="mono" x="764" y="652">m_l    MLP output of block l</text>
    <text class="mono" x="1080" y="652">q_l    logit-lens distribution</text>
    <text class="m" x="764" y="690">q_l = softmax(W_U * Norm(h_l)).</text>
    <text class="m" x="764" y="714">No second forward pass if the activation cache was kept.</text>
  </g>

  <line x1="740" y1="744" x2="740" y2="774" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <text class="s" x="44" y="800">L3  TRANSFORMER DEPTH - SAME BLOCK, DIFFERENT READING AT EACH BAND</text>

  <g filter="url(#shadow)">
    <rect x="44" y="816" width="430" height="530" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="h" x="64" y="846">Depth stack (input at the bottom)</text>
    <text class="m" x="64" y="868">Every layer is tapped. Bars stand for bands of L.</text>

    <rect x="68" y="888" width="382" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="chip" x="84" y="910" fill="#991b1b">B4  Unembedding</text>
    <text class="m" x="84" y="928">LM head. The distribution that was sampled.</text>

    <rect x="68" y="952" width="382" height="84" rx="8" fill="#fef2f2" stroke="#f87171"/>
    <text class="chip" x="84" y="976" fill="#991b1b">B3  Late layers</text>
    <text class="m" x="84" y="998">l = floor(2L/3)+1 ... L</text>
    <text class="m" x="84" y="1018">Narrative form and next-token confidence.</text>

    <rect x="68" y="1048" width="382" height="84" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text class="chip" x="84" y="1072" fill="#92400e">B2  Middle layers</text>
    <text class="m" x="84" y="1094">l = floor(L/3)+1 ... floor(2L/3)</text>
    <text class="m" x="84" y="1114">Factual commitment and causal composition.</text>

    <rect x="68" y="1144" width="382" height="84" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="chip" x="84" y="1168" fill="#1d4ed8">B1  Early layers</text>
    <text class="m" x="84" y="1190">l = 1 ... floor(L/3)</text>
    <text class="m" x="84" y="1210">Lexical form of evidence and entity strings.</text>

    <rect x="68" y="1240" width="382" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="chip" x="84" y="1262" fill="#334155">B0  Embedding</text>
    <text class="m" x="84" y="1280">Token and position identity. No probe here.</text>
    <line x1="259" y1="1240" x2="259" y2="1228" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="492" y="816" width="470" height="530" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="h" x="512" y="846">Anatomy of one block (repeated L times)</text>
    <text class="m" x="512" y="868">Taps sit on the branches. The residual is passed upward.</text>

    <rect x="516" y="888" width="422" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="b" x="532" y="911">1  Norm of the incoming residual</text>
    <rect x="516" y="932" width="422" height="36" rx="7" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text class="b" x="532" y="955">2  Self-attention     tap A_l  (where the claim looks)</text>
    <rect x="516" y="976" width="422" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="b" x="532" y="999">3  Add back into the residual</text>
    <rect x="516" y="1020" width="422" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="b" x="532" y="1043">4  Norm</text>
    <rect x="516" y="1064" width="422" height="36" rx="7" fill="#ede9fe" stroke="#c4b5fd"/>
    <text class="b" x="532" y="1087">5  MLP     tap m_l  (what this layer adds)</text>
    <rect x="516" y="1108" width="422" height="36" rx="7" fill="#dcfce7" stroke="#86efac"/>
    <text class="b" x="532" y="1131">6  Add residual     tap h_l  (state passed upward)</text>
    <rect x="516" y="1152" width="422" height="56" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="b" x="532" y="1174">7  Logit lens     tap q_l</text>
    <text class="m" x="532" y="1194">Project h_l with the final norm and W_U.</text>
    <text class="m" x="512" y="1232">Band edges are a starting cut. L5 weights</text>
    <text class="m" x="512" y="1252">may shift them when the probes are fit.</text>
    <text class="m" x="512" y="1284">z_l pools h_l on the claim, attention mass</text>
    <text class="m" x="512" y="1304">on evidence vs. model prose, and lens entropy.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="816" width="456" height="530" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="h" x="1000" y="846">What each band is asked</text>
    <text class="m" x="1000" y="868">A later band is not a better copy of an earlier one.</text>

    <rect x="1000" y="888" width="416" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="chip" x="1016" y="912" fill="#1d4ed8">Early</text>
    <text class="b" x="1016" y="936">Is this still a copy or a near copy of a</text>
    <text class="b" x="1016" y="956">retrieved string? Entity surface forms live here.</text>
    <text class="m" x="1016" y="976">Logit-lens tokens at this depth are weak.</text>

    <rect x="1000" y="1000" width="416" height="112" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
    <text class="chip" x="1016" y="1024" fill="#92400e">Middle</text>
    <text class="b" x="1016" y="1048">Is the claim being treated as a fact the</text>
    <text class="b" x="1016" y="1068">evidence licenses? Primary input to grounding</text>
    <text class="b" x="1016" y="1088">and causal-entailment probes.</text>

    <rect x="1000" y="1124" width="416" height="112" rx="8" fill="#fef2f2" stroke="#f87171"/>
    <text class="chip" x="1016" y="1148" fill="#991b1b">Late and LM head</text>
    <text class="b" x="1016" y="1172">Is the model committing to one fluent cause?</text>
    <text class="b" x="1016" y="1192">Lens entropy and margin are calibration</text>
    <text class="b" x="1016" y="1212">features, not proof the cause is true.</text>
    <text class="m" x="1000" y="1264">Used on purpose: a confident late lens plus a</text>
    <text class="m" x="1000" y="1284">risky middle entailment score is a fluent</text>
    <text class="m" x="1000" y="1304">unsupported cause, not a reason to accept it.</text>
  </g>

  <line x1="740" y1="1346" x2="740" y2="1376" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <text class="s" x="44" y="1402">L4  FOUR PROBES - ONE RISK PER MODE PER LAYER, NOT ONE HALLUCINATION BIT</text>
  <g filter="url(#shadow)">
    <rect x="44" y="1414" width="338" height="168" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="chip" x="64" y="1444" fill="#6d28d9">G  Evidence grounding</text>
    <text class="b" x="64" y="1474">Did the claim add facts that are</text>
    <text class="b" x="64" y="1494">absent from the tool results?</text>
    <text class="mono" x="64" y="1546">r(l, G) in [0, 1]</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="398" y="1414" width="338" height="168" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="chip" x="418" y="1444" fill="#6d28d9">E  Causal entailment</text>
    <text class="b" x="418" y="1474">Do the grounded facts license</text>
    <text class="b" x="418" y="1494">the stated "because"?</text>
    <text class="mono" x="418" y="1546">r(l, E) in [0, 1]</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="752" y="1414" width="338" height="168" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="chip" x="772" y="1444" fill="#6d28d9">F  Entity fidelity</text>
    <text class="b" x="772" y="1474">Are service, host, span, and error</text>
    <text class="b" x="772" y="1494">ids the ones in evidence?</text>
    <text class="mono" x="772" y="1546">r(l, F) in [0, 1]</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1106" y="1414" width="330" height="168" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="chip" x="1126" y="1444" fill="#6d28d9">C  Calibration</text>
    <text class="b" x="1126" y="1474">Is the stated certainty stronger</text>
    <text class="b" x="1126" y="1494">than the internal alternatives?</text>
    <text class="mono" x="1126" y="1546">r(l, C) in [0, 1]</text>
  </g>

  <line x1="740" y1="1582" x2="740" y2="1612" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <text class="s" x="44" y="1638">L5  DEPTH AGGREGATOR</text>
  <g filter="url(#shadow)">
    <rect x="44" y="1650" width="1392" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="mono" x="64" y="1684">s_m(claim) = sigmoid( sum_l  w(l,m) * r(l,m) + b_m )    for m in {G, E, F, C}</text>
    <text class="b" x="64" y="1718">Weights w are per layer and per mode. Early grounding and middle entailment are not averaged into one score.</text>
    <text class="b" x="64" y="1744">The aggregator also returns the layers with the largest weighted risk, so a flag can be traced to a band.</text>
    <text class="m" x="64" y="1774">A low early grounding risk together with a high middle entailment risk is kept as two facts.</text>
  </g>

  <line x1="740" y1="1800" x2="740" y2="1830" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <text class="s" x="44" y="1856">L6  DECISION POLICY - ONE ACTION PER CLAIM, THEN A ROLLUP</text>
  <g filter="url(#shadow)">
    <rect x="44" y="1870" width="338" height="156" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text class="chip" x="64" y="1900" fill="#047857">Accept</text>
    <text class="b" x="64" y="1930">All four risks sit below</text>
    <text class="b" x="64" y="1950">their thresholds.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="398" y="1870" width="338" height="156" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text class="chip" x="418" y="1900" fill="#c2410c">Request evidence</text>
    <text class="b" x="418" y="1930">Grounding or entity risk is high.</text>
    <text class="b" x="418" y="1950">Name the missing observation.</text>
    <text class="m" x="418" y="1988">Do not invent a replacement cause.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="752" y="1870" width="338" height="156" rx="12" fill="#fffbeb" stroke="#fbbf24"/>
    <text class="chip" x="772" y="1900" fill="#a16207">Rank alternatives</text>
    <text class="b" x="772" y="1930">Facts hold. The cause does not.</text>
    <text class="b" x="772" y="1950">Keep quotes. Drop the leap.</text>
    <text class="m" x="772" y="1988">Return a ranked candidate set.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1106" y="1870" width="330" height="156" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="chip" x="1126" y="1900" fill="#b91c1c">Abstain</text>
    <text class="b" x="1126" y="1930">Calibration risk is high, or the</text>
    <text class="b" x="1126" y="1950">late layer is sure and the middle</text>
    <text class="b" x="1126" y="1970">layer is not. Withhold one cause.</text>
  </g>

  <text class="s" x="44" y="2062">L7  BACK TO THE AGENT</text>
  <g filter="url(#shadow)">
    <rect x="44" y="2074" width="1392" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="b" x="64" y="2108">The diagnosis is accepted only when every causal claim is accepted. One failed entailment withholds the single-cause recommendation.</text>
    <text class="b" x="64" y="2134">The agent may only retrieve more evidence or re-rank. The verifier does not rewrite the incident narrative.</text>
  </g>

  <text class="s" x="44" y="2196">HOW TO READ A FLAG</text>
  <g>
    <rect x="44" y="2210" width="1392" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="64" y="2232" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="m" x="86" y="2244">Early: form and copy</text>
    <rect x="280" y="2232" width="14" height="14" rx="3" fill="#fffbeb" stroke="#fbbf24"/>
    <text class="m" x="302" y="2244">Middle: commitment and cause</text>
    <rect x="560" y="2232" width="14" height="14" rx="3" fill="#fef2f2" stroke="#f87171"/>
    <text class="m" x="582" y="2244">Late: fluency and confidence</text>
    <rect x="840" y="2232" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="m" x="862" y="2244">Probe risk</text>
    <text class="m" x="64" y="2270">Risk is a design score in [0, 1]. Thresholds are configuration. This figure states the structure, not a measured accuracy.</text>
  </g>
</svg>
